<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYNAPSE | Interactive Neural AI Assistant Documentation</title>
  <meta name="description" content="Interactive, code-backed system design, architecture specifications, API workbench, and viva preparation portal for the Synapse local-first AI assistant platform.">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/></svg>">
</head>
<body>

  <!-- Dynamic Background Canvas -->
  <canvas id="synapse-canvas"></canvas>

  <!-- Reading Progress Bar -->
  <div id="reading-progress"></div>

  <!-- Top Navigation Header -->
  <header class="top-navbar">
    <div style="display:flex; align-items:center; gap:14px;">
      <button class="icon-btn mobile-toggle-btn" id="mobile-menu-btn" title="Toggle Navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="logo-area" onclick="navigate('overview')">
        <div class="logo-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">SYNAPSE</span>
          <span class="brand-subtitle">Neural Documentation</span>
        </div>
      </div>
    </div>

    <!-- Search Button Trigger -->
    <button class="header-search-btn" onclick="toggleSearchModal(true)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Quick search documentation...</span>
      <kbd class="kbd-shortcut">Ctrl K</kbd>
    </button>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="icon-btn active" id="btn-audio-toggle" title="Toggle Audio Synthesizer Effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>

      <button class="icon-btn" id="btn-theme-toggle" title="Cycle Themes (Obsidian Neon / Clean Light / OLED)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>

      <a href="https://github.com" target="_blank" class="pill-badge" style="text-decoration:none; display:flex; align-items:center; gap:6px;">
        <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981;"></span>
        v2.4 Local-Ready
      </a>
    </div>
  </header>

  <!-- Application Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <nav id="sidebar-nav"></nav>
    </aside>

    <!-- Main Content Presentation -->
    <main class="main-wrapper">
      <div class="content-container">
        <div id="doc-display-area">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Omni Search Modal (Ctrl + K) -->
  <div class="modal-overlay" id="search-modal" onclick="if(event.target === this) toggleSearchModal(false)">
    <div class="search-dialog">
      <div class="search-input-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-modal-input" placeholder="Search architecture, modules, APIs, or interview QAs..." autocomplete="off">
        <kbd class="kbd-shortcut" onclick="toggleSearchModal(false)" style="cursor:pointer;">ESC</kbd>
      </div>
      <div class="search-results-list" id="search-results-list">
        <!-- Results rendered here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./docs-content.js"></script>
  <script src="./docs-chapters.js"></script>
  <script src="./app.js"></script>
</body>
</html>
